name: Update city page stats
on:
  schedule:
    - cron: '0 14 20 * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update-city-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update city page stats
        run: python3 scripts/update_city_stats.py
      - name: Commit and push if changed
        run: |
          git config user.name "deed-and-door-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- '*.html'; then
            echo "No price change; nothing to commit."
          else
            git add -- '*.html'
            git commit -m "Update city page stats ($(date -u +%Y-%m-%d))"
            git push
          fi
